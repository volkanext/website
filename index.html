<!doctype html>
<html lang="es" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      title, description, canonical, Open Graph, Twitter Card y JSON-LD los
      inyecta el plugin `volkanext-seo` (ver vite.config.ts) desde
      src/data/seo.ts, para que exista una sola fuente de verdad y quede
      presente en el HTML servido, sin depender de que el visitante ejecute JS.
    -->

    <!-- Favicon declarado acá porque Vite lo empaqueta con hash al build;
         si se inyectara desde JS los crawlers que no ejecutan scripts no lo verían. -->
    <link rel="icon" href="/src/assets/icon/logoMin.ico" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
